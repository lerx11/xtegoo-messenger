version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: xtegoo-postgres
    restart: always
    environment:
      POSTGRES_USER: xtegoo
      POSTGRES_PASSWORD: xtegoo123
      POSTGRES_DB: xtegoo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: xtegoo-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: xtegoo-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: xtegoo-libretranslate
    restart: always
    ports:
      - "5000:5000"
    environment:
      - LT_LOAD_ONLY=ru,en,zh,es,fr,de,ar,hi,pt,ja
    volumes:
      - libretranslate_data:/home/libretranslate/.local/share

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xtegoo-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIBRETRANSLATE_URL=${LIBRETRANSLATE_URL}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - PORT=${PORT}
      - NODE_ENV=${NODE_ENV}
    depends_on:
      - postgres
      - redis
      - libretranslate
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
  minio_data:
  libretranslate_data:
